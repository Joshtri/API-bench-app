# Builds the installers and publishes them on a GitHub Release:
#   Windows x64:  .exe (NSIS installer) and .msi
#   Linux x64:    .AppImage, .deb, .rpm
#   Linux ARM64:  .AppImage, .deb, .rpm
# Start it by pushing a tag that matches the app version
# (git tag v0.1.1 && git push origin v0.1.1), or run it by hand from the Actions tab.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: ubuntu-22.04-arm

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "API Bench v__VERSION__"
          releaseBody: "Download the installer for your system below."
          # Published right away so the landing page can link to the files.
          releaseDraft: false
          prerelease: false
